<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista de Tarefas · Guilherme Henrike</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="app-header">
    <div class="app-eyebrow">projeto 02</div>
    <div class="app-title">Lista de Tarefas</div>
    <div class="app-stats" id="stats">0 tarefas</div>
  </div>

  <div class="input-row">
    <input
      class="task-input"
      id="task-input"
      type="text"
      placeholder="Adicionar nova tarefa..."
      maxlength="120"
    />

    <button class="add-btn" id="add-btn">+</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Todas</button>
    <button class="filter-btn" data-filter="active">Pendentes</button>
    <button class="filter-btn" data-filter="done">Concluídas</button>
  </div>

  <div class="task-list" id="task-list"></div>

  <div class="clear-row">
    <button class="clear-btn" id="clear-btn">
      Limpar concluídas
    </button>
  </div>

  <div class="app-footer">
    <span>Guilherme Henrike · Lista de Tarefas</span>
    <span>dados salvos no localStorage 💾</span>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
