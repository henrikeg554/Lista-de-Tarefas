<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista de Tarefas · Guilherme Henrike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D0D0D;
      --surface: #141414;
      --surface2:#1C1C1C;
      --border:  #262626;
      --border2: #333333;
      --text:    #EFEFEB;
      --text2:   #888880;
      --text3:   #555550;
      --accent:  #C8F04D;
      --accent2: #A8D030;
      --danger:  #F87171;
      --radius:  10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem 5rem;
    }

    .app {
      width: 100%;
      max-width: 520px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.05s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .app-header { margin-bottom: 2rem; }

    .app-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .app-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .app-stats {
      margin-top: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text3);
    }

    .app-stats span { color: var(--accent); }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .task-input {
      flex: 1;
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .task-input::placeholder { color: var(--text3); }
    .task-input:focus { border-color: var(--accent); }

    .add-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      width: 44px;
      height: 44px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }

    .add-btn:hover { background: var(--accent2); transform: scale(1.05); }
    .add-btn:active { transform: scale(0.97); }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 1.2rem;
    }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: 0.5px solid var(--border2);
      background: transparent;
      color: var(--text2);
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0D0D0D;
      border-color: var(--accent);
    }

    .filter-btn:not(.active):hover {
      border-color: var(--text3);
      color: var(--text);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s, opacity 0.2s;
      animation: slideIn 0.25s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item.done { opacity: 0.5; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--text3); }
    .task-item:hover { border-color: var(--border2); }

    .task-check {
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--border2);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      font-size: 12px;
    }

    .task-check.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #0D0D0D;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    .task-delete {
      background: transparent;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }

    .task-delete:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

    .empty {
      text-align: center;
      padding: 3rem 0;
      color: var(--text3);
      font-size: 14px;
      font-family: 'DM Mono', monospace;
    }

    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    .clear-row {
      margin-top: 1.2rem;
      display: flex;
      justify-content: flex-end;
    }

    .clear-btn {
      background: transparent;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 12px;
      font-family: 'Outfit', sans-serif;
      color: var(--text3);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .clear-btn:hover { color: var(--danger); border-color: rgba(248,113,113,0.4); }

    .app-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 0.5px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <div class="app-eyebrow"> projeto 02</div>
    <div class="app-title">Lista de Tarefas</div>
    <div class="app-stats" id="stats">0 tarefas</div>
  </div>

  <div class="input-row">
    <input
      class="task-input"
      id="task-input"
      type="text"
      placeholder="Adicionar nova tarefa..."
      maxlength="120"
    />
    <button class="add-btn" id="add-btn" title="Adicionar tarefa">+</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Todas</button>
    <button class="filter-btn" data-filter="active">Pendentes</button>
    <button class="filter-btn" data-filter="done">Concluídas</button>
  </div>

  <div class="task-list" id="task-list"></div>

  <div class="clear-row">
    <button class="clear-btn" id="clear-btn">Limpar concluídas</button>
  </div>

  <div class="app-footer">
    <span>Guilherme Henrike · Lista de Tarefas</span>
    <span>dados salvos no localStorage 💾</span>
  </div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem('gh-tasks') || '[]');
  let filter = 'all';

  function save() {
    localStorage.setItem('gh-tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) return;

    tasks.unshift({ id: Date.now(), text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function getFiltered() {
    if (filter === 'active') return tasks.filter(t => !t.done);
    if (filter === 'done')   return tasks.filter(t => t.done);
    return tasks;
  }

  function render() {
    const list = document.getElementById('task-list');
    const filtered = getFiltered();
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;

    document.getElementById('stats').innerHTML =
      total === 0
        ? '0 tarefas'
        : `<span>${done}</span> de <span>${total}</span> concluída${total !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      const msgs = {
        all:    ['📋', 'nenhuma tarefa ainda', 'adicione algo acima!'],
        active: ['✅', 'tudo concluído!', 'ótimo trabalho!'],
        done:   ['🔲', 'nenhuma tarefa concluída', 'hora de trabalhar!']
      };
      const [icon, line1, line2] = msgs[filter];
      list.innerHTML = `<div class="empty"><div class="empty-icon">${icon}</div>${line1}<br/>${line2}</div>`;
      return;
    }

    list.innerHTML = filtered.map(task => `
      <div class="task-item ${task.done ? 'done' : ''}">
        <div class="task-check ${task.done ? 'checked' : ''}" onclick="toggleTask(${task.id})">
          ${task.done ? '✓' : ''}
        </div>
        <div class="task-text">${escapeHtml(task.text)}</div>
        <button class="task-delete" onclick="deleteTask(${task.id})" title="Remover">✕</button>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('add-btn').addEventListener('click', addTask);

  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  document.getElementById('clear-btn').addEventListener('click', clearDone);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  render();
</script>

</body>
</html>
